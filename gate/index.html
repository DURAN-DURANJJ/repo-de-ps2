<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1115; color:#e8eaf0; font-family:system-ui,sans-serif; }
  form { background:#1a1d24; border:1px solid #2c313c; border-radius:12px; padding:24px; width:min(320px, 90vw); }
  h1 { font-size:1.1rem; margin:0 0 14px; }
  input, button { width:100%; padding:10px; border-radius:8px; border:1px solid #2c313c; background:#232834; color:#e8eaf0; font-size:1rem; box-sizing:border-box; }
  button { margin-top:10px; background:#3b82f6; border:none; cursor:pointer; }
  p { color:#f87171; min-height:1.2em; margin:10px 0 0; font-size:.85rem; }
</style>
</head>
<body>
<form id="f">
  <h1>🎮 PS2</h1>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
  <button type="submit">Entrar</button>
  <p id="msg"></p>
</form>
<script>
  const HASH = '__HASH__';

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const h = await sha256(document.getElementById('pw').value);
    if (h === HASH) {
      try { sessionStorage.setItem('ps2ok', '1'); } catch (err) {}
      location.href = 'app/';
    } else {
      document.getElementById('msg').textContent = 'Contraseña incorrecta';
    }
  });
</script>
</body>
</html>
